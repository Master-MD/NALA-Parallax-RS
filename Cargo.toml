[package]
name = "nala-parallax-rs"
version = "0.4.0-nala.6.6.6"
edition = "2024"
authors = ["NALA-OS Open-Source Engineering", "Gradient Network (Original Python Parallax & C++ parallax_win_cli)"]
license = "Apache-2.0"
description = "100% Native Rust-Turbo (Edition 2024, Zero-Python, Zero-Telemetry) Distributed Pipeline-Parallel LLM Serving, Hybrid Strata 3-Tier x Parallax 4D Sharding (RSI-PRLX-01), Speculative 64B P2P Framing (RSI-PRLX-02), Sub-ms RTT Failover (RSI-PRLX-03), GPU-to-GPU RDMA Zero-CPU-Bounce Bridge (RSI-PRLX-04), Distributed 5-Zone Arena Radix Deduplication (RSI-PRLX-05) & Native Windows DirectML/Vulkan Compute Runner (RSI-PRLX-06)"
repository = "https://github.com/Master-MD/NALA-Parallax-RS"

[[bin]]
name = "nala-parallax-rs"
path = "src/main.rs"

[[bin]]
name = "nala-parallax-win-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
