[package]
name = "nala-parallax-rs"
version = "0.6.0-nala.6.6.6"
edition = "2024"
authors = ["NALA-OS Open-Source Engineering", "Gradient Network (Original Python Parallax & C++ parallax_win_cli)"]
license = "Apache-2.0"
description = "100% Native Rust-Turbo (Edition 2024, Zero-Python, Zero-Telemetry) Distributed Pipeline-Parallel LLM Serving & Windows/Cross-OS CLI with RSI-PRLX-01..15 (4D Sharding, Speculative P2P, RDMA Zero-Bounce, 5-Zone Radix, DirectML/Vulkan, Medusa Tree, MXFP4, Ed25519 P2P, Cat-Safe <28dBA Night Mode, 0ms 2PC Hot-Plug, MoE Locality EP+PP, Understory OKF KV Bridge, Lookahead Jacobi Schema Decoder & 5-Zone SEV-SNP/SEP Confidential Tensor Vault)"
repository = "https://github.com/Master-MD/NALA-Parallax-RS"

[[bin]]
name = "nala-parallax-rs"
path = "src/main.rs"

[[bin]]
name = "nala-parallax-win-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
