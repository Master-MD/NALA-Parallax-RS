[package]
name = "nala-parallax-rs"
version = "0.2.0-nala.6.6.6"
edition = "2024"
authors = ["NALA-OS Open-Source Engineering", "Gradient Network (Original Python Parallax & C++ parallax_win_cli)"]
license = "Apache-2.0"
description = "100% Native Rust-Turbo (Edition 2024, Zero-Python, Zero-Telemetry) Distributed Pipeline-Parallel LLM Serving, Hybrid Strata 3-Tier x Parallax Water-Filling 4D Sharding (RSI-PRLX-01), Speculative 64B Zero-Copy P2P Framing (RSI-PRLX-02), Sub-ms RTT Auto-Failover (RSI-PRLX-03) & Native Windows/Cross-OS CLI (parallax_win_cli port)"
repository = "https://github.com/Master-MD/NALA-Parallax-RS"

[[bin]]
name = "nala-parallax-rs"
path = "src/main.rs"

[[bin]]
name = "nala-parallax-win-cli"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
